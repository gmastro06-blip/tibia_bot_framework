[project]
name = "tibia-bot-framework"
version = "0.1.0"
description = "Framework para bot de Tibia-like"
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]
authors = [
	{ name = "TuNombre", email = "tuemail@example.com" },
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
opencv-python = "*"
mss = "*"
pyautogui = "*"
easyocr = "*"
rapidfuzz = "*"
py-trees = "*"
jsonschema = "*"
imagehash = "*"
keyboard = "*"
numpy = "*"
scipy = "*"
tensorrt = "*"
dxcam = "0.0.5"
psutil = "^7.2.1"
gputil = "^1.4.0"
lupa = "^2.6"
pillow = ">=10"
typed-d3dshot = "^1.0.1"
nvidia-ml-py3 = "^7.352.0"
onnxruntime = "^1.23.2"
torch = {version = "^2.1.0", source = "pytorch"}
pywin32 = "^311"
onnxruntime-gpu = "^1.23.2"
ultralytics = "^8.3.249"
pytest = "^9.0.2"
obsws-python = "^1.8.0"
roboflow = "^1.2.11"

[tool.poetry.group.dev.dependencies]
pytest = "*"
flake8 = "*"
opencv-stubs = "^0.1.1"
mypy = "*"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
markers = [
	"ui: tests que requieren UI/display (Tkinter)",
	"slow: tests lentos o de integración",
]